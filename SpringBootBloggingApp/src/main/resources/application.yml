spring:
  profiles:
    active: dev
  graphql:
    graphiql:
      enabled: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile

app:
  async:
    core-pool-size: ${ASYNC_CORE_POOL_SIZE}
    max-pool-size: ${ASYNC_MAX_POOL_SIZE}
    queue-capacity: ${ASYNC_QUEUE_CAPACITY}
  analytics:
    cleanup-rate-ms: ${ANALYTICS_CLEANUP_RATE_MS}
  post:
    parallel-threshold: ${POST_PARALLEL_THRESHOLD}
  cache:
    ttl-ms: 600000 # default TTL for cache entries (10 minutes)
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS}
  oauth2:
    success-redirect-url: ${OAUTH2_SUCCESS_REDIRECT_URL}


springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
